name: Python checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  portable-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: python -m unittest discover -s tests -v
      # Native tests explicitly skip here. GUI/physical displays require a Mac.
